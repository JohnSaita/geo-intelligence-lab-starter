name: Deploy to GitHub Pages

# Builds the app and publishes it with GitHub Pages (Source: GitHub Actions).
# One-time setup: see "Deploy to GitHub Pages" in the README.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}
      VITE_BASE: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4

      - name: Check the Mapbox token secret
        run: |
          if [ -z "$VITE_MAPBOX_TOKEN" ]; then
            echo "::error::Add a repository secret named VITE_MAPBOX_TOKEN (Settings > Secrets and variables > Actions) with your public pk. token."
            exit 1
          fi
          if [[ "$VITE_MAPBOX_TOKEN" != pk.* ]]; then
            echo "::error::VITE_MAPBOX_TOKEN must be a public token that starts with pk. Never put a secret sk. token in a website."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
